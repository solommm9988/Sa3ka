<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sa3ka Earn - جارٍ التحويل...</title>
  <style>
    body {
      background-color: #0b0f1a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>جارٍ توجيهك إلى Google Play لتثبيت Sa3ka Earn...</h2>
  <p>يرجى الانتظار ثوانٍ قليلة.</p>

  <script>
    // 1. استخراج كود الإحالة من الرابط: sa3kaearn.com/join.html?ref=CODE
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref') || '';

    // 2. تجهيز بارامتر الـ referrer الخاص بجوجل بلاي
    // الصيغة: referrer=ref%3DCODE
    const playStoreBase = "https://play.google.com/store/apps/details?id=com.sa3ka.sa3kaearn";
    let finalUrl = playStoreBase;

    if (refCode) {
      finalUrl += "&referrer=" + encodeURIComponent("ref=" + refCode);
    }

    // 3. التحويل المباشر
    window.location.replace(finalUrl);
  </script>
</body>
</html>
